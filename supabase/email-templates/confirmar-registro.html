<!-- Supabase > Authentication > Emails > Templates > "Confirm sign up"
     Asunto: Confirma tu cuenta en Mis Finanzas -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0f172a;">
  <h2 style="margin: 0 0 16px;">💰 Bienvenido a Mis Finanzas</h2>
  <p>Hola, gracias por registrarte. Para activar tu cuenta, confirma tu correo:</p>
  <p style="margin: 24px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #0f766e; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block;">
      Confirmar mi correo
    </a>
  </p>
  <p style="font-size: 14px; color: #475569;">
    Si el botón no funciona, copia y pega este enlace en tu navegador:<br />
    <a href="{{ .ConfirmationURL }}" style="color: #0f766e; word-break: break-all;">{{ .ConfirmationURL }}</a>
  </p>
  <p style="font-size: 13px; color: #64748b; margin-top: 32px;">
    Si no creaste esta cuenta, puedes ignorar este correo.
  </p>
</div>
